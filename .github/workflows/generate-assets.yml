name: Generate Game Assets (PixelLab)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/setup-game-framework-Qcd9I

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Generate assets via PixelLab API
        env:
          PIXELLAB_SECRET: ${{ secrets.PIXELLAB_SECRET }}
        run: node scripts/generate-assets.mjs

      - name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/
          if git diff --cached --quiet; then
            echo "No new assets generated"
          else
            git commit -m "Add PixelLab-generated game assets"
            git push
          fi
