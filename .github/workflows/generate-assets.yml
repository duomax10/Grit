name: Generate Game Assets (PixelLab)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which assets to generate'
        required: true
        type: choice
        options:
          - graveyard-full
          - walk-anims
          - wang-tilesets
          - character
          - tiles
          - monuments
          - environment
          - house
          - flat-graves
          - all

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/setup-game-framework-Qcd9I

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Generate ${{ inputs.target }} assets
        env:
          PIXELLAB_SECRET: ${{ secrets.PIXELLAB_SECRET }}
        run: |
          if [ "${{ inputs.target }}" = "wang-tilesets" ]; then
            node scripts/generate-wang-tiles.mjs 2>&1 | tee /tmp/generate-log.txt
          elif [ "${{ inputs.target }}" = "graveyard-full" ]; then
            echo "=== GRAVEYARD FULL LEVEL REGENERATION ==="
            echo ""
            echo "Step 1/6: Wang tilesets (grass-to-gravel, grass-to-dirt)..."
            node scripts/generate-wang-tiles.mjs 2>&1 | tee /tmp/generate-log.txt
            echo ""
            echo "Step 2/6: Monuments..."
            node scripts/generate-targeted.mjs monuments 2>&1 | tee -a /tmp/generate-log.txt
            echo ""
            echo "Step 3/6: Environment (trees, fountain, bench, fence, etc)..."
            node scripts/generate-targeted.mjs environment 2>&1 | tee -a /tmp/generate-log.txt
            echo ""
            echo "Step 4/6: Caretaker's house..."
            node scripts/generate-targeted.mjs house 2>&1 | tee -a /tmp/generate-log.txt
            echo ""
            echo "Step 5/6: Flat grave markers..."
            node scripts/generate-targeted.mjs flat-graves 2>&1 | tee -a /tmp/generate-log.txt
            echo ""
            echo "Step 6/6: Character sprites + walk animations..."
            node scripts/generate-targeted.mjs character 2>&1 | tee -a /tmp/generate-log.txt
            node scripts/generate-targeted.mjs walk-anims 2>&1 | tee -a /tmp/generate-log.txt
            echo ""
            echo "=== GRAVEYARD FULL COMPLETE ==="
          else
            node scripts/generate-targeted.mjs ${{ inputs.target }} 2>&1 | tee /tmp/generate-log.txt
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp /tmp/generate-log.txt public/assets/last-generate-log.txt 2>/dev/null || true
          git add public/assets/
          if git diff --cached --quiet; then
            echo "No new assets generated"
          else
            git commit -m "Generate ${{ inputs.target }} assets via PixelLab"
            git push
          fi
