<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Grit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-CBIX14MS.js"></script>
</head>
<body>
  <div id="error-display" style="display:none;position:fixed;top:0;left:0;right:0;padding:10px;background:red;color:white;font-size:12px;z-index:9999;word-wrap:break-word;max-height:50%;overflow:auto;"></div>
  <div id="game-container"></div>
  <script>
    window.onerror = function(msg, url, line, col, err) {
      var el = document.getElementById('error-display');
      el.style.display = 'block';
      el.innerHTML += '<b>Error:</b> ' + msg + '<br>at ' + url + ':' + line + ':' + col + '<br>';
      if (err && err.stack) el.innerHTML += '<pre>' + err.stack + '</pre>';
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('error-display');
      el.style.display = 'block';
      el.innerHTML += '<b>Unhandled Promise:</b> ' + (e.reason ? e.reason.message || e.reason : 'unknown') + '<br>';
      if (e.reason && e.reason.stack) el.innerHTML += '<pre>' + e.reason.stack + '</pre>';
    });
  </script>
</body>
</html>
